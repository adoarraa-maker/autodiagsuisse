<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nouvelle commande — AutoDiag Suisse</title>
</head>
<body style="font-family:Segoe UI,Arial,sans-serif;color:#1a1a1a;line-height:1.5;max-width:640px;margin:0 auto;padding:24px;">
  <!--
    Modèle de référence. L'e-mail réel est généré par
    netlify/functions/_lib/order.js (buildOrderEmailHtml).
    Variables conceptuelles :
      {{NOM}}, {{ADRESSE}}, {{PRODUITS}}, {{TOTAL}}, {{SESSION_ID}}
  -->
  <h1 style="font-size:20px;margin:0 0 8px;">Nouvelle commande — AutoDiag Suisse</h1>
  <p style="margin:0 0 20px;color:#555;">Paiement Stripe confirmé</p>

  <h2 style="font-size:15px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.04em;">
    Adresse de livraison (copier-coller)
  </h2>
  <pre style="background:#f4f4f4;border:1px solid #ddd;padding:16px;font-size:14px;white-space:pre-wrap;border-radius:6px;">{{NOM}}
{{LIGNE1}}
{{LIGNE2}}
{{NPA}} {{VILLE}}
{{PAYS}}
Tél: {{TELEPHONE}}
E-mail: {{EMAIL}}</pre>

  <h2 style="font-size:15px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.04em;">
    Produit(s)
  </h2>
  <p style="margin:0;">{{PRODUITS}}</p>

  <p style="margin:20px 0 0;"><strong>Total payé :</strong> {{TOTAL}}</p>
  <p style="margin:4px 0 0;font-size:13px;color:#666;">Session Stripe : {{SESSION_ID}}</p>
</body>
</html>
